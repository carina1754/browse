<!doctype html>
<meta charset="utf-8" />
<!-- chat.html 과 같은 정책이다. IPC 로만 말하고 원격 자원을 안 쓴다.
     화면에 들어가는 문자열은 전부 textContent 로만 넣는다 (innerHTML 금지). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>설정</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  body { background: #1e1e1e; color: #e0e0e0; overflow-y: auto; }
  main { padding: 14px 16px 20px; }
  h2 { font-size: 13px; font-weight: 600; color: #aaa; margin: 18px 0 6px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .row label { flex: 1; cursor: pointer; }
  .row.sub { padding-left: 16px; }
  .row.sub.off label { color: #666; }
  .why { color: #777; font-size: 11px; padding: 0 0 6px 40px; }
  .row button { background: #2f6f3f; border: 0; color: #fff; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  .row button[disabled] { background: #444; color: #888; cursor: default; }
  .row button.ghost { background: #3a3a3a; }
  .warn { color: #b58900; font-size: 11px; padding-top: 8px; border-top: 1px solid #333; margin-top: 10px; }
  .err { color: #ff6b6b; font-size: 11px; padding-top: 6px; }
  .row input:not([type=checkbox]) {
    flex: 1; min-width: 0; background: #2b2b2b; border: 1px solid #3a3a3a;
    color: #e0e0e0; border-radius: 3px; padding: 3px 6px; font: inherit;
  }
</style>
<main id="panel">불러오는 중…</main>
<script>
  const panel = document.getElementById('panel');
  let settings = null;
  let deps = [];
  let account = null;
  let loginNote = '';
  let error = '';
  let vaultRows = [];
  let vaultNote = '';

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // 재시작/로그아웃이 도는 동안 또 누르면 에이전트가 겹쳐 뜬다. 잠가둔다.
  // 어느 경로든 끝나면 render() 가 화면을 새로 그려서 같이 풀린다.
  function lock() {
    panel.querySelectorAll('input, button').forEach((i) => { i.disabled = true; });
  }

  async function apply(next) {
    lock();
    try {
      settings = await window.api.setSettings(next);
      error = '';
    } catch (e) {
      error = '설정 저장 실패: ' + (e && e.message ? e.message : e);
    } finally {
      render();
    }
  }

  function render() {
    panel.replaceChildren();
    accountSection();
    vaultSection();
    if (!settings) {
      // 여기서 error 를 안 찍으면 설정을 못 읽었을 때 "불러오는 중…" 으로 영원히 굳는다.
      panel.append(el('div', error ? 'err' : 'why', error || '설정 불러오는 중…'));
      return;
    }

    panel.append(el('h2', null, '토큰 절약'));

    const master = el('div', 'row');
    const mbox = el('input');
    mbox.type = 'checkbox';
    mbox.checked = !!settings.tokenSaver;
    mbox.id = 'master';
    mbox.onchange = () => apply({ ...settings, tokenSaver: mbox.checked });
    const mlabel = el('label', null, '토큰 절약 켜기');
    mlabel.htmlFor = 'master';
    master.append(mbox, mlabel);
    panel.append(master);

    for (const d of deps) {
      if (d.name === 'claude') continue; // 필수 도구는 아래에서 따로 다룬다
      const row = el('div', 'row sub');
      if (!settings.tokenSaver) row.classList.add('off');

      const box = el('input');
      box.type = 'checkbox';
      box.id = 'm-' + d.name;
      box.checked = !!settings.modes[d.name];
      // 마스터가 꺼져 있거나 도구가 없으면 켤 수 없다.
      box.disabled = !settings.tokenSaver || !d.ok;
      box.onchange = () => apply({
        ...settings,
        modes: { ...settings.modes, [d.name]: box.checked },
      });

      const label = el('label', null, d.label);
      label.htmlFor = box.id;
      row.append(box, label);

      if (!d.ok) row.append(installButton(d));
      panel.append(row, el('div', 'why', d.why));
    }

    const claude = deps.find((d) => d.name === 'claude');
    if (claude) {
      panel.append(el('h2', null, '필수'));
      const row = el('div', 'row');
      row.append(el('label', null, claude.label + (claude.ok ? ' — 설치됨' : ' (없으면 아무것도 안 된다)')));
      if (!claude.ok) row.append(installButton(claude));
      panel.append(row, el('div', 'why', claude.why));
    }

    panel.append(el('div', 'warn', '설정을 바꾸면 에이전트가 재시작되고 지금까지 대화는 초기화된다. 설치 진행 상황은 채팅 창에 그대로 나온다.'));
    if (error) panel.append(el('div', 'err', error));
  }

  // --- 계정 -----------------------------------------------------------------

  function button(text, cls, onclick) {
    const b = el('button', cls, text);
    b.onclick = onclick;
    return b;
  }

  function accountSection() {
    panel.append(el('h2', null, '계정'));
    if (!account) {
      panel.append(el('div', 'why', '읽는 중…'));
      return;
    }

    const a = account.auth || {};
    const row = el('div', 'row');
    if (a.error) row.append(el('label', null, '계정을 못 읽었다: ' + a.error));
    else if (!a.loggedIn) row.append(el('label', null, '로그인 안 됨'));
    else row.append(el('label', null, [a.email, a.plan, a.org].filter(Boolean).join(' · ') || '로그인됨'));

    if (a.loggedIn) row.append(button('로그아웃', 'ghost', doLogout));
    else row.append(button('로그인', null, doLogin));
    row.append(button('새로고침', 'ghost', () => refresh(true)));
    panel.append(row);

    // 구독 한도 잔여량. 못 읽으면 이유를 그대로 보여준다 — 빈 줄이면 사용자는
    // 한도가 없는 건지 앱이 멈춘 건지 구분을 못 한다.
    const lim = account.limits || {};
    panel.append(el('div', 'why', lim.limits && lim.limits.length
      ? lim.limits.map((l) => l.label + ' ' + l.remaining + '% 남음').join(' · ')
      : '남은 사용량: ' + (lim.error || '알 수 없다')));

    if (loginNote) panel.append(el('div', 'why', loginNote));
  }

  // --- 비밀번호 ---------------------------------------------------------------
  // 비밀번호는 이 창으로 절대 안 돌아온다. 저장(add)은 사용자가 방금 친 값을
  // main 으로 보내는 한 방향이고, 목록(list)에는 host/user 만 온다.

  async function reloadVault() {
    vaultRows = await window.api.listVault().catch(() => vaultRows);
    render();
  }

  function vaultSection() {
    panel.append(el('h2', null, '비밀번호'));
    for (const r of vaultRows) {
      const row = el('div', 'row');
      row.append(el('label', null, r.host + ' · ' + r.user));
      row.append(button('삭제', 'ghost', async () => {
        lock();
        await window.api.removeVault(r.host, r.user).catch(() => {});
        vaultNote = '';
        await reloadVault();
      }));
      panel.append(row);
    }

    const row = el('div', 'row');
    const mk = (ph) => { const i = el('input'); i.placeholder = ph; return i; };
    const host = mk('사이트 (예: google.com)');
    const user = mk('아이디');
    const pass = mk('비밀번호');
    pass.type = 'password';
    row.append(host, user, pass, button('저장', null, async () => {
      lock();
      const res = await window.api.addVault(host.value, user.value, pass.value)
        .catch((e) => ({ ok: false, detail: e && e.message ? e.message : String(e) }));
      vaultNote = res.ok ? res.detail : '저장 실패: ' + res.detail;
      await reloadVault();
    }));
    panel.append(row);

    panel.append(el('div', 'why',
      'OS 계정 키(DPAPI)로 암호화해서 이 PC 에만 저장한다. 채우기는 주소창 옆 🔑 — '
      + '호스트가 맞는 사이트에서만 된다. 비밀번호는 AI 에이전트에게 안 보인다.'));
    if (vaultNote) panel.append(el('div', vaultNote.startsWith('저장 실패') ? 'err' : 'why', vaultNote));
  }

  async function refresh(force) {
    try {
      account = await window.api.getAccount(force);
    } catch (e) {
      account = { auth: { error: e && e.message ? e.message : String(e) }, limits: {} };
    }
    render();
  }

  async function doLogout() {
    lock();
    const res = await window.api.logout().catch((e) => ({ ok: false, detail: e.message }));
    loginNote = res.ok ? '로그아웃했다. 다시 로그인해야 에이전트가 돈다.' : '로그아웃 실패: ' + res.detail;
    await refresh(true);
  }

  async function doLogin() {
    lock();
    const res = await window.api.login().catch((e) => ({ ok: false, detail: e.message }));
    loginNote = res.detail;
    await refresh(true);
    if (res.ok) poll();
  }

  // 로그인은 별도 콘솔 창에서 끝난다 — 끝났다고 알려주는 신호가 없다.
  // 잠깐 훑어보다가 로그인된 게 보이면 멈춘다.
  let timer = null;
  function poll() {
    if (timer) clearInterval(timer);
    let left = 24; // 5초 × 24 = 2분
    timer = setInterval(async () => {
      await refresh(true);
      const on = account && account.auth && account.auth.loggedIn;
      if (!on && --left > 0) return;
      clearInterval(timer);
      timer = null;
      if (on) {
        loginNote = '로그인됐다. 에이전트가 다시 떴다.';
        render();
      }
    }, 5000);
  }

  // --- 도구 -----------------------------------------------------------------

  function installButton(dep) {
    const btn = el('button', null, '설치');
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = '설치 중…';
      try {
        await window.api.installDep(dep.name);
        deps = await window.api.checkDeps();
        error = '';
      } catch (e) {
        // 여기서 안 잡으면 버튼이 "설치 중…" 으로 영원히 굳는다.
        error = '설치 호출 실패: ' + (e && e.message ? e.message : e);
      } finally {
        render();
      }
    };
    return btn;
  }

  async function load() {
    try {
      [settings, deps] = await Promise.all([window.api.getSettings(), window.api.checkDeps()]);
    } catch (e) {
      error = '설정을 못 읽었다: ' + (e && e.message ? e.message : e);
    }
    vaultRows = await window.api.listVault().catch(() => []);
    render();
    // 계정은 프로세스를 띄우고 네트워크를 친다. 설정 화면을 먼저 그리고 뒤따라 채운다.
    refresh(false);
  }
  load();
</script>
