<!doctype html>
<meta charset="utf-8" />
<!-- default-src 'none' 이 핵심이다. 이 창은 IPC 로만 말하고 원격 자원을 하나도 안 쓴다.
     그래서 이미지/폰트/fetch/프레임이 전부 막혀서 유출 통로가 남지 않는다.
     스크립트와 스타일은 이 파일 안에 인라인이라 'unsafe-inline' 이 필요하다. 대신
     화면에 들어가는 에이전트 텍스트는 전부 textContent 로만 넣는다 (innerHTML 금지) —
     그 규칙이 깨지면 이 정책으로는 못 막는다. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>chat</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #1e1e1e; color: #e0e0e0; }
  #log { flex: 1; overflow-y: auto; padding: 12px; white-space: pre-wrap; }
  .user { color: #7cc3ff; margin-top: 12px; }
  .tool { color: #b58900; font-size: 12px; }
  .err  { color: #ff6b6b; }
  #bar { display: flex; border-top: 1px solid #333; }
  #input { flex: 1; padding: 10px; border: 0; background: #2a2a2a; color: inherit; font: inherit; }
  #input:focus { outline: none; }
  /* 맨 아래 한 줄에는 이번 세션이 태운 양만 둔다. 계정과 한도는 설정 창에 있다.
     줄바꿈은 막는다 — 바 높이가 바뀌면 위 대화창이 튄다. */
  #status { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-top: 1px solid #333; font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; }
  #usage { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #gear { flex: 0 0 auto; cursor: pointer; background: none; border: 0; color: #888; font-size: 13px; padding: 0 2px; }
  #gear:hover { color: #e0e0e0; }
</style>
<div id="log"></div>
<div id="bar"><input id="input" placeholder="무엇을 할까요?" autofocus /></div>
<div id="status">
  <button id="gear" title="설정">⚙</button>
  <span id="usage"></span>
</div>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const usageLabel = document.getElementById('usage');
  let streaming = null;

  function line(cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // 설정은 이 창이 아니라 별도 창(renderer/settings.html)이다. 항목이 계속
  // 늘어날 자리라 380px 사이드바 안에 접어 넣을 게 못 된다.
  document.getElementById('gear').onclick = () => {
    window.api.openSettings().catch((e) => line('err', '! 설정 창을 못 열었다: ' + (e && e.message ? e.message : e)));
  };

  // --- 사용량 ------------------------------------------------------------
  // 이번 에이전트로 태운 토큰과 비용. 에이전트가 다시 뜨면 대화가 초기화되므로
  // 여기도 0 으로 되돌린다 ('modes' 가 재시작 신호다). 계정과 구독 한도 잔여량은
  // 이 줄이 아니라 설정 창에 있다.
  let session = { tokens: 0, cost: 0 };

  function short(n) {
    if (n < 1000) return String(n);
    if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + 'k';
    return (n / 1000000).toFixed(1) + 'M';
  }

  function paintUsage() {
    usageLabel.textContent = session.tokens
      ? short(session.tokens) + ' · $' + session.cost.toFixed(session.cost >= 1 ? 2 : 3)
      : '';
  }

  function addUsage(evt) {
    const u = evt.usage || {};
    // 캐시 읽기/쓰기도 토큰이다. 빼고 세면 실제로 태운 양보다 훨씬 작게 보인다.
    session.tokens += (u.input_tokens || 0) + (u.output_tokens || 0)
      + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
    session.cost += evt.cost || 0;
    paintUsage();
  }

  // --- 대화 -----------------------------------------------------------------

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !input.value.trim()) return;
    line('user', '> ' + input.value);
    window.api.send(input.value);
    input.value = '';
    streaming = null;
  });

  window.api.onEvent((evt) => {
    if (evt.type === 'text') {
      if (!streaming) streaming = line('assistant', '');
      streaming.textContent += evt.text;
      log.scrollTop = log.scrollHeight;
    } else if (evt.type === 'modes') {
      // 에이전트가 새로 떴다 = 대화도 사용량도 처음부터다. 어떤 모드가 걸렸는지는
      // note() 로 대화창에 이미 찍힌다 — 상태 줄에 또 달지 않는다.
      session = { tokens: 0, cost: 0 };
      paintUsage();
    } else if (evt.type === 'tool') {
      streaming = null;
      line('tool', '· ' + evt.text);
    } else if (evt.type === 'usage') {
      addUsage(evt);
    } else if (evt.type === 'done') {
      streaming = null;
    } else if (evt.type === 'error') {
      streaming = null;
      line('err', '! ' + evt.text);
    }
  });
</script>
